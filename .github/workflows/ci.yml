# Builds the ROM in the pinned builder image (reproducible: compare the
# SHA-256 printed here with a local build of the same commit) and runs the
# host tests. On a version tag (v*), drafts a release with the ROM.
name: build-and-test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0  # tags, so a release build names its version

      - name: Builder image (devkitARM, pinned by digest)
        run: docker build -t nds-signer-builder .

      - name: Build the ROM
        run: docker run --rm -v "$PWD":/source nds-signer-builder make MPY_APP=1

      - name: SHA-256
        run: sha256sum nds-signer.nds | tee SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: nds-signer
          path: |
            nds-signer.nds
            SHA256.txt

      - name: MicroPython unix port for the host tests
        run: docker run --rm -v "$PWD":/source nds-signer-builder make mpy-unix

      - name: Files written by the containers (root) to the runner's user
        run: sudo chown -R "$(id -u):$(id -g)" .

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Host test dependencies
        run: pip install -r tests/requirements.txt qrcode pillow

      - name: Host tests (SeedSigner flows on the simulated DSi, CPython references)
        run: make -C tests/host all seedsigner PYTHON="$(which python)"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nds-signer
      - name: Draft release (published by hand after checking the hash)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" nds-signer.nds SHA256.txt \
            --repo "$GITHUB_REPOSITORY" --draft --prerelease \
            --title "NDS-Signer $GITHUB_REF_NAME" \
            --notes "See CHANGELOG.md. Verify: sha256sum -c SHA256.txt"
